<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendador Financiero AI</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 15px;
      width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      color: #e67e22;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: span 2;
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #7f8c8d;
      display: block;
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background: #e67e22;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }

    button:hover {
      background: #d35400;
    }

    #result {
      margin-top: 25px;
      background: #ecf0f1;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .rec-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7f8c8d;
      text-align: center;
    }

    .product-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2c3e50;
      text-align: center;
      margin: 10px 0;
    }

    .confidence {
      text-align: center;
      font-size: 0.9rem;
      color: #27ae60;
      font-weight: bold;
    }

    .details {
      margin-top: 15px;
      font-size: 0.8rem;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    .bar-container {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .bar-label {
      width: 40%;
    }

    .bar-bg {
      width: 60%;
      background: #ddd;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #3498db;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🎯 Recomendador Contextual</h2>
    <p style="text-align: center; font-size: 0.9rem; margin-bottom: 20px;">
      Motor de IA basado en Embeddings para detectar el producto ideal.
    </p>

    <form id="recForm">
      <div class="grid">
        <div>
          <label>Ingreso Mensual ($)</label>
          <input type="number" id="ingreso" value="15000">
        </div>
        <div>
          <label>Deuda Actual ($)</label>
          <input type="number" id="deuda" value="2000">
        </div>
        <div>
          <label>Ahorro ($)</label>
          <input type="number" id="ahorro" value="500">
        </div>
        <div>
          <label>Edad</label>
          <input type="number" id="edad" value="30">
        </div>
        <div>
          <label>Dependientes</label>
          <input type="number" id="dependientes" value="1">
        </div>
        <div>
          <label>Sexo</label>
          <select id="sexo">
            <option value="1">Hombre</option>
            <option value="0">Mujer</option>
          </select>
        </div>
        <div class="full">
          <label>Nivel Educativo</label>
          <select id="eduId">
            <option value="0">Sin instrucción</option>
            <option value="2">Primaria</option>
            <option value="5">Secundaria</option>
            <option value="6">Preparatoria</option>
            <option value="7">Licenciatura</option>
            <option value="8">Posgrado</option>
          </select>
        </div>
        <div class="full">
          <label>Región Geográfica</label>
          <select id="regionId">
            <option value="0">Norte (Industrial)</option>
            <option value="2">Centro (Servicios)</option>
            <option value="1">Sur (Turismo/Rural)</option>
            <option value="3">Bajío (Manufactura)</option>
          </select>
        </div>
        <div class="full">
          <label>Tenencia Vivienda</label>
          <select id="vivienda">
            <option value="0">Rentada / Prestada</option>
            <option value="1">Propia</option>
          </select>
        </div>
      </div>

      <button type="submit">Generar Recomendación</button>
    </form>

    <div id="result">
      <div class="rec-title">Producto Recomendado</div>
      <div class="product-name" id="pName"></div>
      <div class="confidence" id="pConf"></div>

      <div class="details">
        <strong>Otras posibilidades:</strong>
        <div id="bars"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('recForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = e.target.querySelector('button');
      btn.innerText = "Calculando Vectores...";

      const data = {
        ingreso: document.getElementById('ingreso').value,
        deuda: document.getElementById('deuda').value,
        ahorro: document.getElementById('ahorro').value,
        edad: document.getElementById('edad').value,
        dependientes: document.getElementById('dependientes').value,
        sexo: document.getElementById('sexo').value,
        vivienda: document.getElementById('vivienda').value,
        regionId: document.getElementById('regionId').value,
        eduId: document.getElementById('eduId').value
      };

      const res = await fetch('/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const json = await res.json();

      document.getElementById('result').style.display = 'block';
      document.getElementById('pName').innerText = json.producto_recomendado;
      document.getElementById('pConf').innerText = `Match del ${json.confianza}%`;

      // Generar barras de probabilidad
      const barsDiv = document.getElementById('bars');
      barsDiv.innerHTML = '';

      // Ordenar por score y tomar top 3 secundarios
      json.todas_opciones
        .sort((a, b) => b.score - a.score)
        .slice(1, 4) // Saltamos el primero (ya mostrado) y mostramos los siguientes 3
        .forEach(opt => {
          const scorePct = (opt.score * 100).toFixed(0);
          barsDiv.innerHTML += `
                    <div class="bar-container">
                        <div class="bar-label">${opt.producto}</div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${scorePct}%"></div>
                        </div>
                        <div style="font-size:0.7rem; margin-left:5px;">${scorePct}%</div>
                    </div>
                `;
        });

      btn.innerText = "Generar Recomendación";
    });
  </script>

</body>

</html>
