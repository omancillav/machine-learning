<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Financiera - ENSAFI</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #e9ecef;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 450px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #495057;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .checkbox-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      background: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #218838;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      text-align: center;
      border: 1px solid transparent;
    }

    .perfil-success {
      background: #d4edda;
      color: #155724;
      border-color: #c3e6cb;
    }

    .perfil-warning {
      background: #fff3cd;
      color: #856404;
      border-color: #ffeeba;
    }

    .perfil-danger {
      background: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Predicción de Perfil ENSAFI</h2>
    <form id="aiForm">

      <div class="form-group">
        <label>Ingreso Mensual Total ($)</label>
        <input type="number" id="ingreso" required placeholder="Ej. 12000" min="1000">
      </div>

      <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Edad (Jefe)</label>
          <input type="number" id="edad" required placeholder="Ej. 45" min="18" max="100">
        </div>
        <div style="flex: 1;">
          <label>Personas en Hogar</label>
          <input type="number" id="personas" required placeholder="Ej. 4" min="1">
        </div>
      </div>

      <div class="form-group">
        <label>Nivel Educativo</label>
        <select id="educacion" required>
          <option value="">Cargando datos...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Localidad</label>
        <select id="localidad" required>
          <option value="">Cargando datos...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Servicios Básicos</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="srv_agua"> Agua</label>
          <label><input type="checkbox" id="srv_internet"> Internet</label>
          <label><input type="checkbox" id="srv_drenaje"> Drenaje</label>
        </div>
      </div>

      <button type="submit">Calcular Perfil de Riesgo</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    // Cargar opciones al inicio
    fetch('/opciones')
      .then(res => res.json())
      .then(data => {
        if (data.error) { alert(data.error); return; }

        const eduSelect = document.getElementById('educacion');
        const locSelect = document.getElementById('localidad');

        eduSelect.innerHTML = data.educacion.map(e => `<option value="${e}">${e}</option>`).join('');
        locSelect.innerHTML = data.localidad.map(l => `<option value="${l}">${l}</option>`).join('');
      })
      .catch(err => console.error("Error cargando opciones", err));

    // Enviar predicción
    document.getElementById('aiForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Calcular Score de Servicios (0, 1, 2, 3)
      let srvScore = 0;
      if (document.getElementById('srv_agua').checked) srvScore++;
      if (document.getElementById('srv_internet').checked) srvScore++;
      if (document.getElementById('srv_drenaje').checked) srvScore++;

      const data = {
        ingreso: document.getElementById('ingreso').value,
        edad: document.getElementById('edad').value,
        personas: document.getElementById('personas').value,
        educacion: document.getElementById('educacion').value,
        localidad: document.getElementById('localidad').value,
        servicios: srvScore
      };

      const resultDiv = document.getElementById('resultado');
      resultDiv.style.display = 'block';
      resultDiv.innerText = "Analizando...";
      resultDiv.className = '';

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (result.error) {
          resultDiv.innerText = "Error: " + result.error;
          return;
        }

        // Estilos según el resultado
        let cssClass = 'perfil-danger';
        if (result.perfil.includes('Ahorrador')) cssClass = 'perfil-success';
        if (result.perfil.includes('Inversor')) cssClass = 'perfil-warning';

        resultDiv.className = cssClass;
        resultDiv.innerHTML = `
                <h3>${result.perfil}</h3>
                <p>Confianza del modelo: <strong>${result.confianza}%</strong></p>
                <small>Basado en patrones de ${data.localidad}</small>
            `;

      } catch (error) {
        resultDiv.innerText = "Error de conexión con el modelo.";
      }
    });
  </script>

</body>

</html>
