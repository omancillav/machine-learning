<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Crédito Hipotecario</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      padding-top: 40px;
      margin: 0;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 450px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 0.9em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 0.85em;
      font-weight: 600;
      color: #34495e;
      display: block;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 1em;
      transition: 0.3s;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1a5276;
      transform: translateY(-2px);
    }

    #result-box {
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      display: none;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .res-alta {
      background-color: #d5f5e3;
      color: #186a3b;
      border: 1px solid #abebc6;
    }

    .res-media {
      background-color: #fcf3cf;
      color: #9a7d0a;
      border: 1px solid #f9e79f;
    }

    .res-baja {
      background-color: #fadbd8;
      color: #943126;
      border: 1px solid #f5b7b1;
    }

    .score-big {
      font-size: 2.5em;
      font-weight: bold;
      margin: 10px 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>🏠 Perfil Hipotecario</h2>
    <p class="subtitle">Predicción basada en IA con TensorFlow</p>

    <form id="mortgageForm">
      <div class="form-group">
        <label>Ingreso Mensual del Hogar (MXN)</label>
        <input type="number" id="ingreso" placeholder="Ej. 25000" required min="0">
      </div>

      <div class="form-group">
        <label>Edad del Solicitante</label>
        <input type="number" id="edad" placeholder="Ej. 35" required min="18" max="99">
      </div>

      <div class="form-group">
        <label>Personas en el Hogar</label>
        <input type="number" id="personas" placeholder="Ej. 3" required min="1" max="15">
      </div>

      <div class="form-group">
        <label>Nivel Educativo</label>
        <select id="educacion">
          <option value="Sin estudios">Sin estudios</option>
          <option value="Primaria">Primaria</option>
          <option value="Secundaria">Secundaria</option>
          <option value="Preparatoria">Preparatoria</option>
          <option value="Licenciatura">Licenciatura</option>
          <option value="Posgrado">Posgrado</option>
        </select>
      </div>

      <div class="form-group">
        <label>¿Tiene Internet en Casa?</label>
        <select id="internet">
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </div>

      <button type="submit" id="btnCalc">Analizar Viabilidad</button>
    </form>

    <div id="result-box">
      <span id="res-mensaje" style="font-weight: bold; letter-spacing: 1px;"></span>
      <span id="res-score" class="score-big"></span>
      <small>Probabilidad estimada por el modelo</small>
    </div>
  </div>

  <script>
    document.getElementById('mortgageForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnCalc');
      const box = document.getElementById('result-box');

      btn.innerText = "Procesando...";
      btn.disabled = true;
      box.style.display = 'none';

      const data = {
        ingreso: document.getElementById('ingreso').value,
        edad: document.getElementById('edad').value,
        personas: document.getElementById('personas').value,
        educacion: document.getElementById('educacion').value,
        internet: document.getElementById('internet').value === 'true'
      };

      try {
        const res = await fetch('http://localhost:3000/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.error) throw new Error(result.error);

        box.style.display = 'block';
        box.className = ''; // Reset class

        if (result.score_raw > 0.7) box.classList.add('res-alta');
        else if (result.score_raw > 0.4) box.classList.add('res-media');
        else box.classList.add('res-baja');

        document.getElementById('res-mensaje').innerText = result.mensaje;
        document.getElementById('res-score').innerText = result.probabilidad;

      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        btn.innerText = "Analizar Viabilidad";
        btn.disabled = false;
      }
    });
  </script>

</body>

</html>
