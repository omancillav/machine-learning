<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicción de Riesgo ENSAFI</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding-top: 40px;
      margin: 0;
    }

    .card {
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      font-size: 0.9em;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
      display: block;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #34495e;
    }

    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    #result-box {
      margin-top: 25px;
      display: none;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }

    .risk-bajo {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .risk-medio {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    .risk-alto {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .probs {
      font-size: 0.8em;
      margin-top: 10px;
      color: #666;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Evaluación de Riesgo</h2>
    <form id="riskForm">
      <label>Edad del Jefe de Hogar</label>
      <input type="number" id="edad" placeholder="Ej. 45" required min="15" max="99">

      <label>Nivel Educativo</label>
      <select id="educacion">
        <option value="Sin estudios">Sin estudios</option>
        <option value="Primaria">Primaria</option>
        <option value="Secundaria">Secundaria</option>
        <option value="Preparatoria">Preparatoria</option>
        <option value="Licenciatura">Licenciatura</option>
        <option value="Posgrado">Posgrado</option>
      </select>

      <label>Región Geográfica (ID)</label>
      <input type="number" id="region" placeholder="1 a 8" required min="1" max="8">

      <label>Tiene Internet</label>
      <select id="internet">
        <option value="true">Sí</option>
        <option value="false">No</option>
      </select>

      <button type="submit" id="btnCalc">Calcular Riesgo</button>
    </form>

    <div id="result-box">
      <h3 id="risk-title" style="margin:0; font-size: 1.5em;"></h3>
      <p>Confianza: <span id="risk-conf"></span></p>
      <div class="probs">
        <div>Bajo: <span id="p-bajo"></span></div>
        <div>Medio: <span id="p-medio"></span></div>
        <div>Alto: <span id="p-alto"></span></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('riskForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnCalc');
      const box = document.getElementById('result-box');

      btn.disabled = true;
      btn.innerText = "Procesando...";
      box.style.display = 'none';

      const data = {
        edad: document.getElementById('edad').value,
        educacion: document.getElementById('educacion').value,
        region: document.getElementById('region').value,
        internet: document.getElementById('internet').value === 'true'
      };

      try {
        const res = await fetch('http://localhost:3000/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.error) throw new Error(result.error);

        // Mostrar resultado
        box.style.display = 'block';
        box.className = ''; // Reset clases

        const riesgo = result.riesgo_predicho;
        box.classList.add(riesgo === 'Alto' ? 'risk-alto' : (riesgo === 'Medio' ? 'risk-medio' : 'risk-bajo'));

        document.getElementById('risk-title').innerText = `Riesgo: ${riesgo.toUpperCase()}`;
        document.getElementById('risk-conf').innerText = result.confianza;

        document.getElementById('p-bajo').innerText = result.probabilidades.Bajo;
        document.getElementById('p-medio').innerText = result.probabilidades.Medio;
        document.getElementById('p-alto').innerText = result.probabilidades.Alto;

      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Calcular Riesgo";
      }
    });
  </script>

</body>

</html>
