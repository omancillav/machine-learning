<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Límite de Crédito - Suite Financiera</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-bg: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-active: #3b82f6;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #334155;
      --primary: #3b82f6;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i {
      color: var(--primary);
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin-bottom: 10px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--sidebar-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 8px;
      transition: all 0.3s;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
    }

    .nav-links a.active {
      border-left: 4px solid var(--primary);
      padding-left: 11px;
    }

    .nav-links i {
      width: 20px;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      color: var(--text-main);
      font-size: 1.8rem;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 700px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    #result-box {
      margin-top: 25px;
      padding: 20px;
      background-color: #f8fafc;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e2e8f0;
      display: none;
    }

    .amount {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--success);
      display: block;
      margin: 10px 0;
    }

    .currency {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="logo">
      <i class="fas fa-chart-pie"></i>
      FinSuite AI
    </div>
    <ul class="nav-links">
      <li><a href="http://localhost:3001"><i class="fas fa-shield-alt"></i> Riesgo Financiero</a></li>
      <li><a href="http://localhost:3002" class="active"><i class="fas fa-credit-card"></i> Límite de Crédito</a></li>
      <li><a href="http://localhost:3003"><i class="fas fa-user-tie"></i> Asesor Inteligente</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>Calculadora de Crédito</h1>
    </div>

    <div class="card">
      <p style="color: #64748b; margin: 0 0 25px 0;">Predicción de límite seguro usando Regresión Lineal.</p>

      <form id="creditForm">
        <div class="form-group">
          <label>Ingreso Mensual ($)</label>
          <input type="number" id="ingreso" required placeholder="Ej. 15000">
        </div>
        <div class="form-group">
          <label>Deuda Total ($)</label>
          <input type="number" id="deuda" required placeholder="Ej. 5000">
        </div>
        <div class="form-group">
          <label>Edad</label>
          <input type="number" id="edad" required placeholder="Ej. 30" min="18" max="99">
        </div>
        <div class="form-group">
          <label>Dependientes</label>
          <input type="number" id="dependientes" required placeholder="Ej. 2">
        </div>
        <button type="submit">Calcular Límite</button>
      </form>

      <div id="result-box">
        <span style="color: #64748b; font-size: 0.9rem;">Límite Sugerido Mensual</span>
        <span class="amount" id="monto-output">$0.00</span>
        <span class="currency">MXN (Pesos Mexicanos)</span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('creditForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const originalText = btn.innerText;
      btn.innerText = "Calculando...";
      btn.disabled = true;

      const data = {
        ingreso: document.getElementById('ingreso').value,
        deuda: document.getElementById('deuda').value,
        edad: document.getElementById('edad').value,
        dependientes: document.getElementById('dependientes').value
      };

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();

        if (result.error) {
          alert(result.error);
        } else {
          document.getElementById('result-box').style.display = 'block';
          const formatter = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
          document.getElementById('monto-output').innerText = formatter.format(result.limite_sugerido);
        }
      } catch (error) {
        console.error(error);
        alert("Error de conexión");
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
