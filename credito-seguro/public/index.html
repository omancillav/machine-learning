<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Límites de Crédito (AI)</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    h2 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      /* Para que el padding no rompa el ancho */
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    #result-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: #f8f9fa;
      border-radius: 6px;
      text-align: center;
      display: none;
      border-left: 5px solid #3498db;
    }

    .amount {
      font-size: 2rem;
      font-weight: bold;
      color: #27ae60;
      display: block;
      margin-top: 5px;
    }

    .info {
      font-size: 0.8rem;
      color: #7f8c8d;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Pre-Aprobación de Crédito</h2>
    <form id="creditForm">
      <div class="form-group">
        <label>Ingreso Mensual del Hogar ($)</label>
        <input type="number" id="ingreso" required placeholder="Ej. 15000">
      </div>
      <div class="form-group">
        <label>Deuda Total Actual ($)</label>
        <input type="number" id="deuda" required placeholder="Ej. 5000">
      </div>
      <div class="form-group">
        <label>Edad del Solicitante</label>
        <input type="number" id="edad" required placeholder="Ej. 30" min="18" max="99">
      </div>
      <div class="form-group">
        <label>Número de Dependientes</label>
        <input type="number" id="dependientes" required placeholder="Ej. 2">
      </div>
      <button type="submit">Calcular Límite Seguro</button>
    </form>

    <div id="result-box">
      <span class="info">Límite Sugerido por IA:</span>
      <span class="amount" id="monto-output">$0.00</span>
      <span class="info">MXN Mensuales</span>
    </div>
  </div>

  <script>
    document.getElementById('creditForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = e.target.querySelector('button');
      const originalText = btn.innerText;
      btn.innerText = "Calculando...";
      btn.disabled = true;

      const data = {
        ingreso: document.getElementById('ingreso').value,
        deuda: document.getElementById('deuda').value,
        edad: document.getElementById('edad').value,
        dependientes: document.getElementById('dependientes').value
      };

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.error) {
          alert(result.error);
        } else {
          document.getElementById('result-box').style.display = 'block';
          // Formato de moneda bonito
          const formatter = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN'
          });
          document.getElementById('monto-output').innerText = formatter.format(result.limite_sugerido);
        }
      } catch (error) {
        console.error(error);
        alert("Error de conexión con el servidor");
      }

      btn.innerText = originalText;
      btn.disabled = false;
    });
  </script>

</body>

</html>
