<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesor Inteligente - Suite Financiera</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-bg: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-active: #3b82f6;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #334155;
      --primary: #3b82f6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i {
      color: var(--primary);
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin-bottom: 10px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--sidebar-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 8px;
      transition: all 0.3s;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
    }

    .nav-links a.active {
      border-left: 4px solid var(--primary);
      padding-left: 11px;
    }

    .nav-links i {
      width: 20px;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      color: var(--text-main);
      font-size: 1.8rem;
      margin: 0;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 25px;
      max-width: 1200px;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--text-main);
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.9rem;
      margin-top: 15px;
    }

    label:first-child {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      background-color: #f8fafc;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    /* Result Area */
    #resultado {
      display: none;
    }

    .result-banner {
      background: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .result-banner h3 {
      margin: 0;
      font-size: 1.4rem;
    }

    .confidence {
      font-size: 0.8rem;
      opacity: 0.9;
      display: block;
      margin-bottom: 5px;
    }

    .diagnostico {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 15px;
      color: #92400e;
      border-radius: 4px;
      margin-bottom: 20px;
      font-style: italic;
    }

    .action-list {
      list-style: none;
      padding: 0;
    }

    .action-list li {
      background: #f8fafc;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      display: flex;
      gap: 10px;
    }

    .action-list li:before {
      content: "\f00c";
      /* FontAwesome check */
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      color: var(--primary);
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="logo">
      <i class="fas fa-chart-pie"></i>
      FinSuite AI
    </div>
    <ul class="nav-links">
      <li><a href="http://localhost:3001"><i class="fas fa-shield-alt"></i> Riesgo Financiero</a></li>
      <li><a href="http://localhost:3002"><i class="fas fa-credit-card"></i> Límite de Crédito</a></li>
      <li><a href="http://localhost:3003" class="active"><i class="fas fa-user-tie"></i> Asesor Inteligente</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>Asesor Financiero Inteligente</h1>
    </div>

    <div class="dashboard-grid">
      <!-- Input Column -->
      <div class="card">
        <h2>Datos del Perfil</h2>
        <form id="advisorForm">
          <label>Edad</label>
          <input type="number" id="edad" placeholder="Ej. 35" min="18" max="99" required>

          <label>Ingreso Mensual ($)</label>
          <input type="number" id="ingreso" placeholder="Ej. 18000" min="1" required>

          <label>Deuda Total ($)</label>
          <input type="number" id="deuda" placeholder="Ej. 5000" min="0" required>

          <label>Región</label>
          <select id="region">
            <option value="1">Norte</option>
            <option value="2">Sur</option>
            <option value="3">Centro</option>
            <option value="4">Bajío / Occidente</option>
          </select>

          <label class="checkbox-row">
            <input type="checkbox" id="seguridad">
            <span>Tiene Seguridad Social</span>
          </label>

          <button type="submit">Generar Estrategia</button>
        </form>
      </div>

      <!-- Output Column -->
      <div class="card" id="resultado">
        <div class="result-banner">
          <span class="confidence">Confianza IA: <span id="confianza"></span>%</span>
          <h3 id="planTitulo">...</h3>
        </div>

        <div class="diagnostico">
          <strong>Diagnóstico:</strong> <span id="diagnosticoTexto"></span>
        </div>

        <p id="planDescripcion" style="color: #64748b; line-height: 1.6; margin-bottom: 25px;"></p>

        <h4 style="margin-bottom: 15px; color: var(--text-main);">Plan de Acción Recomendado</h4>
        <ul id="listaAcciones" class="action-list"></ul>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('advisorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.querySelector('button');
      const originalText = btn.innerText;
      btn.innerText = "Analizando...";
      btn.disabled = true;

      const payload = {
        edad: document.getElementById('edad').value,
        ingreso: document.getElementById('ingreso').value,
        deuda: document.getElementById('deuda').value,
        region: document.getElementById('region').value,
        seguridad_social: document.getElementById('seguridad').checked ? 1 : 0
      };

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.error) {
          alert(data.error);
        } else {
          document.getElementById('resultado').style.display = 'block';

          document.getElementById('planTitulo').innerText = data.titulo;
          document.getElementById('confianza').innerText = data.confianza;
          document.getElementById('diagnosticoTexto').innerText = data.diagnostico_personalizado;
          document.getElementById('planDescripcion').innerText = data.descripcion;

          const lista = document.getElementById('listaAcciones');
          lista.innerHTML = '';
          data.acciones.forEach(accion => {
            const li = document.createElement('li');
            li.innerText = accion;
            lista.appendChild(li);
          });

          // Dynamic Banner Color
          const banner = document.querySelector('.result-banner');
          const title = data.titulo.toLowerCase();
          if (title.includes("consolidación")) banner.style.background = "#ef4444";
          else if (title.includes("austeridad")) banner.style.background = "#f59e0b";
          else if (title.includes("inversión")) banner.style.background = "#10b981";
          else banner.style.background = "#3b82f6";
        }
      } catch (err) {
        console.error(err);
        alert("Error de conexión");
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
